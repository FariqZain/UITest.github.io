<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhammad Fariq Zain - Motion Graphic Portfolio Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --g-blue: #4285F4;
      --g-red: #EA4335;
      --g-yellow: #FBBC05;
      --g-green: #34A853;
      --ux-cyan: #00F2FE;
      --ux-purple: #A855F7;
    }

    body {
      margin: 0;
      background-color: #070A12;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Perspective Grid Background */
    .bg-grid {
      background-size: 48px 48px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      animation: gridPan 20s linear infinite;
    }

    @keyframes gridPan {
      0% { background-position: 0 0; }
      100% { background-position: 48px 48px; }
    }

    /* Flowing SVG Energy Streams */
    .stream-base {
      fill: none;
      stroke-width: 2.5;
      opacity: 0.3;
    }

    .stream-pulse {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 180 1200;
      animation: flowStream 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .stream-pulse-fast {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 100 1300;
      animation: flowStream 3.2s linear infinite;
    }

    .delay-1 { animation-delay: -0.8s; }
    .delay-2 { animation-delay: -1.6s; }
    .delay-3 { animation-delay: -2.4s; }
    .delay-4 { animation-delay: -3.1s; }

    @keyframes flowStream {
      0% { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: -200; }
    }

    /* Floating Glassmorphic UI Cards */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .float-slow { animation: floatY 6s ease-in-out infinite; }
    .float-med  { animation: floatY 4.5s ease-in-out infinite -1.5s; }
    .float-fast { animation: floatY 5.2s ease-in-out infinite -3s; }

    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }

    /* Animated UI Cursor */
    .ui-cursor {
      animation: cursorMove 5s ease-in-out infinite;
    }

    @keyframes cursorMove {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      35% { transform: translate(42px, -22px) scale(1); }
      42% { transform: translate(42px, -22px) scale(0.85); }
      50% { transform: translate(42px, -22px) scale(1); }
      80% { transform: translate(-15px, 18px) scale(1); }
    }

    /* Animated Button Highlight synced with Cursor */
    .proto-btn {
      animation: btnActivate 5s ease-in-out infinite;
    }

    @keyframes btnActivate {
      0%, 38%, 100% { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.4); box-shadow: none; }
      42%, 65% { background: rgba(0, 242, 254, 0.85); border-color: #00F2FE; box-shadow: 0 0 18px rgba(0, 242, 254, 0.6); }
    }

    /* Animated Bar Chart */
    .bar-anim-1 { animation: barPulse 2.4s ease-in-out infinite alternate; }
    .bar-anim-2 { animation: barPulse 1.8s ease-in-out infinite alternate -0.5s; }
    .bar-anim-3 { animation: barPulse 2.1s ease-in-out infinite alternate -1.2s; }
    .bar-anim-4 { animation: barPulse 1.5s ease-in-out infinite alternate -0.8s; }

    @keyframes barPulse {
      0% { transform: scaleY(0.35); transform-origin: bottom; }
      100% { transform: scaleY(1); transform-origin: bottom; }
    }

    /* Radial Gauge Animation */
    .gauge-ring {
      stroke-dasharray: 157;
      stroke-dashoffset: 157;
      animation: fillGauge 4s ease-in-out infinite alternate;
    }

    @keyframes fillGauge {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 32; }
    }

    /* Pulsing Node Rings */
    .node-ping {
      animation: pingRing 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes pingRing {
      75%, 100% { transform: scale(2.8); opacity: 0; }
    }
  </style>
</head>

  <!-- Particle System & 3D Parallax Script -->
  <script>
    // 1. Subtle 3D Mouse Parallax
    const scene = document.getElementById('scene');
    window.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.clientX) / 45;
      const y = (window.innerHeight / 2 - e.clientY) / 45;
      scene.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    // 2. Ambient Floating Tech Particles
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#00F2FE', '#A855F7'];
    const particles = Array.from({ length: 55 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.2 + 0.6,
      dx: (Math.random() - 0.3) * 0.6,
      dy: (Math.random() - 0.5) * 0.6,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: Math.random() * 0.65 + 0.2
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      for (const p of particles) {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x > width) p.x = 0;
        if (p.x < 0) p.x = width;
        if (p.y > height) p.y = 0;
        if (p.y < 0) p.y = height;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
